<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recibos</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --tx:#1d2330; --mut:#6b7280; --ac:#2563eb; --bd:#d9dde3; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--tx); }
  .app { max-width:1000px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:16px; margin-bottom:16px; }
  form { display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap:10px; align-items:end; }
  label { font-size:12px; color:var(--mut); display:flex; flex-direction:column; gap:4px; }
  input, select { font:inherit; padding:8px; border:1px solid var(--bd); border-radius:6px; }
  button { font:inherit; padding:9px 14px; border:0; border-radius:6px; background:var(--ac); color:#fff; cursor:pointer; }
  button.sec { background:#e5e7eb; color:var(--tx); }
  button.del { background:#dc2626; padding:5px 9px; font-size:13px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:8px; border-bottom:1px solid var(--bd); text-align:left; }
  td.v, th.v { text-align:right; white-space:nowrap; }
  .tw { overflow-x:auto; }
  .tot { font-weight:700; }
  #print { display:none; }

  /* ===== Impressão A4 ===== */
  @page { size: A4; margin: 12mm; }
  @media print {
    body { background:#fff; }
    .app { display:none; }
    #print { display:block; font-family: Arial, sans-serif; color:#000; }
    .rec { border:1.5px dashed #000; padding:10mm; margin-bottom:8mm; page-break-inside:avoid; break-inside:avoid; }
    .rec h2 { margin:0 0 4mm; font-size:18pt; text-align:center; letter-spacing:2px; }
    .rec .val { font-size:16pt; font-weight:bold; text-align:right; margin-bottom:4mm; }
    .rec p { font-size:12pt; line-height:1.6; margin:2mm 0; }
    .rec .ass { margin-top:12mm; text-align:center; }
    .rec .ass div { border-top:1px solid #000; width:70%; margin:0 auto; padding-top:2mm; font-size:10pt; }
    .rec table { font-size:11pt; }
    .rec th, .rec td { border-bottom:1px solid #999; padding:4px; }
    .cupom { width:80mm; margin:0 auto; }
    .cupom h2 { font-size:13pt; }
    .cupom table, .cupom p { font-size:9pt; }
    .quebra { page-break-after:always; break-after:page; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>Registro de Pagamentos / Recibos</h1>

  <div class="card">
    <div class="bar" style="margin-bottom:12px">
      <label style="flex:1">Pagador (recebi de)<input id="pagador" placeholder="Nome de quem pagou"></label>
    </div>
    <form id="f">
      <label>Item<input id="item" list="sug" required placeholder="Ex: IPTU"></label>
      <datalist id="sug"><option>IPTU</option><option>Água</option><option>Luz</option><option>Condomínio</option><option>Aluguel</option><option>Internet</option><option>Gás</option></datalist>
      <label>Referência<input id="ref" placeholder="Ex: 10/2026"></label>
      <label>Valor (R$)<input id="valor" type="number" step="0.01" min="0" required></label>
      <label>Data pagamento<input id="data" type="date" required></label>
      <label>Situação<select id="sit"><option>Pago</option><option>Pendente</option></select></label>
      <button type="submit">Adicionar</button>
    </form>
  </div>

  <div class="card">
    <div class="bar" style="margin-bottom:10px">
      <button onclick="imprimir('recibos')">Imprimir recibos (A4)</button>
      <button onclick="imprimir('geral')">Imprimir geral (A4)</button>
      <button onclick="imprimir('cupom')">Imprimir geral em cupom</button>
      <button class="sec" onclick="exportar()">Backup (salvar)</button>
      <button class="sec" onclick="document.getElementById('imp').click()">Restaurar backup</button>
      <input id="imp" type="file" accept=".json" hidden onchange="importar(this)">
      <button class="sec" onclick="limpar()">Limpar tudo</button>
    </div>
    <div class="tw"><table>
      <thead><tr><th><input type="checkbox" id="all" checked onchange="marcarTodos(this.checked)"></th><th>Item</th><th>Ref.</th><th>Data</th><th>Situação</th><th class="v">Valor</th><th></th></tr></thead>
      <tbody id="lista"></tbody>
    </table></div>
    <p style="color:var(--mut);font-size:13px">Só os itens marcados entram na impressão.</p>
  </div>

  <div class="card">
    <h3 style="margin-top:0">Geral (agrupado por item)</h3>
    <div class="tw"><table><tbody id="geral"></tbody></table></div>
  </div>
</div>

<div id="print"></div>

<script>
const K = 'recibos_v1';
let st = { itens: [], pagador:'', recebedor:'' };
try { st = Object.assign(st, JSON.parse(localStorage.getItem(K)) || {}); } catch(e) {}
const $ = id => document.getElementById(id);
const brl = v => Number(v).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const dt = d => d ? d.split('-').reverse().join('/') : '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const salvar = () => { try { localStorage.setItem(K, JSON.stringify(st)); } catch(e) {} };

$('data').value = new Date().toISOString().slice(0,10);
$('pagador').value = st.pagador;
$('pagador').oninput = e => { st.pagador = e.target.value; salvar(); };

$('f').onsubmit = e => {
  e.preventDefault();
  st.itens.push({ id: Date.now(), item: $('item').value.trim(), ref: $('ref').value.trim(),
    valor: parseFloat($('valor').value), data: $('data').value, sit: $('sit').value, sel: true });
  salvar(); render();
  $('item').value = ''; $('ref').value = ''; $('valor').value = ''; $('item').focus();
};

function remover(id) { if (confirm('Excluir este item?')) { st.itens = st.itens.filter(i => i.id !== id); salvar(); render(); } }
function marcar(id, v) { st.itens.find(i => i.id === id).sel = v; salvar(); render(); }
function marcarTodos(v) { st.itens.forEach(i => i.sel = v); salvar(); render(); }
function limpar() { if (confirm('Apagar TODOS os registros?')) { st.itens = []; salvar(); render(); } }

function agrupar(lista) {
  const g = {};
  lista.forEach(i => { const k = i.item; g[k] = g[k] || { qtd:0, total:0 }; g[k].qtd++; g[k].total += i.valor; });
  return Object.entries(g).sort((a,b) => a[0].localeCompare(b[0]));
}

function tabelaGeral(lista) {
  const t = lista.reduce((s,i) => s + i.valor, 0);
  return '<tr><th>Item</th><th>Qtd</th><th class="v">Total</th></tr>' +
    agrupar(lista).map(([k,v]) => `<tr><td>${esc(k)}</td><td>${v.qtd}</td><td class="v">${brl(v.total)}</td></tr>`).join('') +
    `<tr class="tot"><td>TOTAL GERAL</td><td>${lista.length}</td><td class="v">${brl(t)}</td></tr>`;
}

function render() {
  $('lista').innerHTML = st.itens.map(i => `<tr>
    <td><input type="checkbox" ${i.sel ? 'checked' : ''} onchange="marcar(${i.id}, this.checked)"></td>
    <td>${esc(i.item)}</td><td>${esc(i.ref)}</td><td>${dt(i.data)}</td><td>${esc(i.sit)}</td>
    <td class="v">${brl(i.valor)}</td><td><button class="del" onclick="remover(${i.id})">x</button></td></tr>`).join('')
    || '<tr><td colspan="7" style="color:var(--mut)">Nenhum item cadastrado.</td></tr>';
  $('all').checked = st.itens.length > 0 && st.itens.every(i => i.sel);
  $('geral').innerHTML = tabelaGeral(st.itens);
}

function recibo(i) {
  return `<div class="rec">
    <h2>RECIBO</h2>
    <div class="val">${brl(i.valor)}</div>
    <p>Recebi de <b>${esc(st.pagador) || '____________________'}</b> a importância de <b>${brl(i.valor)}</b>,
      referente a <b>${esc(i.item)}</b>${i.ref ? ' (' + esc(i.ref) + ')' : ''}.</p>
    <p>Situação: <b>${esc(i.sit).toUpperCase()}</b> &nbsp;—&nbsp; Data do pagamento: <b>${dt(i.data)}</b></p>
  </div>`;
}

function imprimir(tipo) {
  const sel = st.itens.filter(i => i.sel);
  if (!sel.length) return alert('Nenhum item marcado.');
  const hoje = new Date().toLocaleDateString('pt-BR');
  let h = '';
  if (tipo === 'recibos') h = sel.map(recibo).join('');
  else {
    h = `<div class="rec ${tipo === 'cupom' ? 'cupom' : ''}">
      <h2>RESUMO GERAL</h2>
      ${st.pagador ? `<p>Pagador: <b>${esc(st.pagador)}</b></p>` : ''}
      <p>Emitido em ${hoje}</p>
      <table style="width:100%;border-collapse:collapse">${tabelaGeral(sel)}</table>
      <p style="margin-top:4mm"><b>Detalhado:</b></p>
      <table style="width:100%;border-collapse:collapse">
        ${sel.map(i => `<tr><td>${esc(i.item)} ${esc(i.ref)}</td><td>${dt(i.data)}</td><td>${esc(i.sit)}</td><td class="v" style="text-align:right">${brl(i.valor)}</td></tr>`).join('')}
      </table>
      </div>`;
  }
  $('print').innerHTML = h;
  window.print();
}

function exportar() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(st, null, 2)], { type:'application/json' }));
  a.download = 'recibos-backup.json'; a.click();
}
function importar(inp) {
  const r = new FileReader();
  r.onload = () => { try { st = JSON.parse(r.result); salvar(); location.reload(); } catch(e) { alert('Arquivo inválido'); } };
  r.readAsText(inp.files[0]);
}
render();
</script>
</body>
</html>
